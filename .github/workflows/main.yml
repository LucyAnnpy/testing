name: Test Schedule

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Show Time
        run: |
          echo "UTC : $(date -u)"
          echo "WIB : $(TZ=Asia/Jakarta date)"
          echo "Event: $GITHUB_EVENT_NAME"
